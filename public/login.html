<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in - VALORANT CG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The same two faces the dashboard loads, so the first page an operator
         sees is the page they end up on. See index.html for the offline note. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <!--
    The only page served without a login, so it is deliberately the only page
    that knows nothing: no state, no stream, no catalogue. It posts a username
    and a password and reloads.
  -->
  <body class="login-body">
    <main class="login-card">
      <div class="login-mark"></div>
      <h1>VALORANT CG</h1>
      <p class="login-sub">Broadcast graphics control</p>

      <form id="login-form" autocomplete="on">
        <label class="login-field">
          <span>Username</span>
          <input
            type="text"
            id="login-username"
            name="username"
            autocomplete="username"
            spellcheck="false"
            autocapitalize="none"
            required
          />
        </label>

        <label class="login-field">
          <span>Password</span>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required />
        </label>

        <p class="login-error" id="login-error" hidden role="alert"></p>

        <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
      </form>

      <!--
        Outside the form on purpose: it is a navigation, not a submission, and
        inside a form a stray Enter could trigger it instead of signing in.
        Hidden until /api/auth/state says the server has Discord configured, so
        a deployment without it shows no dead button. The mark is inline rather
        than fetched - this page has to work on a machine with no network.
      -->
      <a class="btn btn-discord" id="login-discord" href="/api/auth/discord/start" hidden>
        <svg viewBox="0 0 24 24" class="discord-mark" aria-hidden="true">
          <path
            fill="currentColor"
            d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.198.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"
          />
        </svg>
        <span id="login-discord-label">Continue with Discord</span>
      </a>

      <p class="login-note" id="login-note" hidden></p>
    </main>

    <script src="/login.js" type="module"></script>
  </body>
</html>
