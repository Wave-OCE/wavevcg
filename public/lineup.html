<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VALORANT Team Lineup - Output</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/lineup.css" />
  </head>

  <!--
    OBS browser source: 1920 x 1080, transparent, "Shutdown source when not
    visible" off.

    A squad, full screen, in one of three formats off one state:

      photos     a row of portraits with a name under each
      detailed   the same, with the Riot ID under the name
      names      no portraits at all - large names beside the crest

    The format is a picker rather than a fixed design because a show that has
    not photographed anybody yet still needs a lineup, and a portrait shoot
    happens late and usually for four of the five. See lineup-schema.js.

    The seats are built in lineup.js so their count comes from the state rather
    than from five copies of the same block here.
  -->
  <body>
    <div id="stage">
      <div class="lineup" id="lineup">
        <div class="head">
          <div class="head-eyebrow" id="eyebrow" hidden></div>
          <div class="head-team" id="team-name"></div>
        </div>

        <div class="row" id="row"></div>
        <div class="names" id="names" hidden></div>
        <div class="crest" id="crest" hidden><img id="crest-img" alt="" /></div>

        <div class="event-logo" id="event-logo" hidden><img id="event-logo-img" alt="" /></div>
      </div>
    </div>

    <script src="/lineup.js" type="module"></script>
  </body>
</html>
